# Neuralwatt の残高・当月の使用量・キーの上限を Prometheus の指標にする exporter（Lepinoid/infra#84）。
# - Neuralwatt の GET /v1/quota を一定間隔（この配備では 15 分。下の NEURALWATT_POLL_INTERVAL）で 1 本だけ呼び、最後に成功した値を /metrics で返す。
#   scrape（PodMonitor）とアラートは turtton/infra#195 が扱う。Service は作らない（Prometheus は Pod を直接 scrape する）。
# - API キーは dsh-agent と同じ Secret dsh-agent-secrets の NEURALWATT_API_KEY だけをファイルとして投影する。
#   exporter は取得のたびにファイルを読み直すので、キーを替えても再起動は要らない
#   （kubelet が Secret の更新をマウントへ反映するまでに最大で 1〜2 分かかる）。
# - イメージはこのリポジトリの exporters/neuralwatt（publish workflow: neuralwatt-exporter-image.yml）。
#   tag@digest で固定する（ci/check-manifests.sh が検査する）。版を上げるときは publish workflow の実行ログの
#   "Published: <ref>@<digest>" を貼る（手順は README の「neuralwatt-exporter」節）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralwatt-exporter
  labels:
    app.kubernetes.io/name: neuralwatt-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: neuralwatt-exporter
  template:
    metadata:
      labels:
        # PodMonitor（turtton/infra#195）と neuralwatt-exporter/network-policy.yaml が選ぶラベル。変えるときは両方を合わせる。
        app.kubernetes.io/name: neuralwatt-exporter
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # Secret のファイル（defaultMode 0440）をグループ経由で読めるようにする。
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: neuralwatt-exporter
          image: ghcr.io/lepinoid/neuralwatt-exporter:26.11.10-39702@sha256:85683c794be3d0d0d329cdf79029bc65bf52a22522a95c4fff4671a9df449558
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          env:
            - {name: NEURALWATT_API_KEY_FILE, value: /var/run/neuralwatt/api-key}
            # 月の予算（USD）。指標 neuralwatt_monthly_budget_usd になり、ダッシュボードとアラートの比率の分母に使う。
            - {name: NEURALWATT_MONTHLY_BUDGET_USD, value: "20"}
            # /v1/quota を取得する間隔（既定 60 秒、下限 10 秒）。月 20 ドルの予算の残高・費用の確認には 15 分で足りる（ユーザーの判断）。
            # 取得が失敗すると fetch_success は次の取得（15 分後）まで 0 のままで、429 のバックオフも最短 15 分になる。
            # 影響とアラートの規則との関係は README の「取得間隔（15 分）の影響」。
            - {name: NEURALWATT_POLL_INTERVAL, value: 15m}
          ports:
            # PodMonitor が名前 metrics で選ぶ。
            - {name: metrics, containerPort: 8080, protocol: TCP}
          # /healthz はプロセスが生きていれば 200（Neuralwatt の API の失敗では落とさない）。
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - {name: neuralwatt-api-key, mountPath: /var/run/neuralwatt, readOnly: true}
      volumes:
        - name: neuralwatt-api-key
          secret:
            secretName: dsh-agent-secrets
            defaultMode: 0440
            # 他のキー（LEPINOID_MCP_TOKEN など）は投影しない。
            items:
              - {key: NEURALWATT_API_KEY, path: api-key}
