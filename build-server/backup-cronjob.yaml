apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: build-server-mysql-backup
  labels:
    recurring-job-group.longhorn.io/gameserver: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-gameserver
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: build-server-mysql-dump
spec:
  # 03:30 JST（クラスタは UTC で動作）
  schedule: "30 18 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: build-server-mysql-dump
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mysql-dump
              image: mysql:8.4
              env:
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: build-server-mysql-credentials
                      key: MYSQL_PASSWORD
              command:
                - sh
                - -c
                - mysqldump -h build-server-mysql -u coreprotect -p"$MYSQL_PASSWORD" --single-transaction coreprotect | gzip > /backup/coreprotect-$(date +%Y%m%d).sql.gz
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          # longhorn-gameserver は strict-local のため mainworker-1 へのピン留めが必須
          nodeSelector:
            kubernetes.io/hostname: mainworker-1
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: build-server-mysql-backup
