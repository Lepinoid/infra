---
# Tailscale Operator (tailscale namespace) からの Ingress 許可
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-build-server-tailscale-ingress
spec:
  podSelector:
    matchLabels:
      app: build-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 25565
---
# build-server からの Egress 許可
# Paper 本体ダウンロード / GitHub への git push (LepinoidTools AutoCommit) など外部 HTTPS 用
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-build-server-egress
spec:
  podSelector:
    matchLabels:
      app: build-server
  policyTypes:
    - Egress
  egress:
    - {}
---
# plugin-updater CronJob からの Egress 許可（CiliumNetworkPolicy）
# 許可するのは kube-apiserver / GHCR / kube-dns の 3 系統のみ
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: plugin-updater-egress
spec:
  endpointSelector:
    matchLabels:
      app: plugin-updater-job
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: ghcr.io
        - matchPattern: "*.ghcr.io"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
