# Flux reconcile の管理・適用対象にしないため kustomization.yaml の resources には追加しない、手動利用専用の standalone rescue Pod。
apiVersion: v1
kind: Pod
metadata:
  name: build-server-rescue
  namespace: lepinoid
  labels:
    app: build-server-rescue
spec:
  imagePullSecrets:
    - name: ghcr-pull-secret
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: rescue
      image: ghcr.io/lepinoid/plugin-updater:26.09.22-4527f@sha256:1b36effb0264531a53838502d83d868f645851eba811a71f29b214faa1cb2716
      command: ["/bin/busybox"]
      args: ["sleep", "infinity"]
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
  nodeSelector:
    kubernetes.io/hostname: mainworker-1
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: build-server-data
