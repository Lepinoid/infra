apiVersion: batch/v1
kind: CronJob
metadata:
  name: plugin-updater
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1740
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: plugin-updater-job
        spec:
          serviceAccountName: plugin-updater
          restartPolicy: Never
          # Longhorn dataLocality: strict-local のため mainworker-1 にピン留め（Deployment と同条件）
          nodeSelector:
            kubernetes.io/hostname: mainworker-1
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: build-server-data
          containers:
            - name: updater
              image: ghcr.io/lepinoid/plugin-updater:26.09.22-5c4b4@sha256:5bb0fd7860d8d76f8424ff6a191de036309859d0648b3fbefb5077a808a72231
              imagePullPolicy: IfNotPresent
              args: ["run"]
              env:
                - name: JOB_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
