apiVersion: batch/v1
kind: CronJob
metadata:
  name: plugin-updater
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1740
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: plugin-updater-job
        spec:
          serviceAccountName: plugin-updater
          restartPolicy: Never
          # Longhorn dataLocality: strict-local のため mainworker-1 にピン留め（Deployment と同条件）
          nodeSelector:
            kubernetes.io/hostname: mainworker-1
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: build-server-data
          containers:
            - name: updater
              image: ghcr.io/lepinoid/plugin-updater:26.09.08-6001a@sha256:f66de5f8bd3c93559d2704765950674d33238763cd76f013f79a7acaeddf3abc
              imagePullPolicy: IfNotPresent
              args: ["run"]
              # updater は KUBECONFIG 環境変数を参照しないため、 kubectl が in-cluster の
              # ServiceAccount トークンを使うようにするには、 KUBECONFIG を明示的に空にする
              # 必要がある。 value: "" は Kubernetes API が無視することがあるため、 空の
              # 文字列リテラルとして指定する。
              env:
                - name: KUBECONFIG
                  value: ''
                - name: JOB_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
