apiVersion: batch/v1
kind: CronJob
metadata:
  name: plugin-updater
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1740
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: plugin-updater-job
        spec:
          serviceAccountName: plugin-updater
          restartPolicy: Never
          # Longhorn dataLocality: strict-local のため mainworker-1 にピン留め（Deployment と同条件）
          nodeSelector:
            kubernetes.io/hostname: mainworker-1
          imagePullSecrets:
            - name: ghcr-pull-secret
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: build-server-data
            - name: ghcr-docker-config
              secret:
                secretName: ghcr-pull-secret
                items:
                  - key: .dockerconfigjson
                    path: config.json
          containers:
            - name: updater
              image: ghcr.io/lepinoid/plugin-updater:26.09.22-97da6@sha256:d7ab8293533f9eff0db1b31ab074a193d4cdf53d801804e07e23110954403218
              imagePullPolicy: IfNotPresent
              args: ["run"]
              env:
                - name: JOB_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: DOCKER_CONFIG
                  value: /etc/ghcr
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: ghcr-docker-config
                  mountPath: /etc/ghcr
                  readOnly: true
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
