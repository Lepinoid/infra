apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - couchdb/credentials.sops.yaml
  - couchdb/users.sops.yaml
  - couchdb/configmap.yaml
  - couchdb/setup.yaml
  - couchdb/pvc.yaml
  - couchdb/deployment.yaml
  - couchdb/service.yaml
  - livesync-bridge/config.sops.yaml
  - livesync-bridge/helmrelease.yaml
  - cloudflared/tunnel-token.sops.yaml
  - cloudflared/network-policy.yaml
  - cloudflared/deployment.yaml
  - grafana/admin-credentials.sops.yaml
  - grafana/datasource.yaml
  - grafana/dashboard-provisioning.yaml
  - grafana/dashboard-lepinoid-pods.yaml
  - grafana/pvc.yaml
  - grafana/deployment.yaml
  - grafana/service.yaml
  - lepinoid/ghcr-pull-secret.sops.yaml
  - lepinoid/db-credentials.sops.yaml
  - lepinoid/auth-secret.sops.yaml
  - lepinoid/runtime-secrets.sops.yaml
  - lepinoid/db-pvc.yaml
  - lepinoid/db-deployment.yaml
  - lepinoid/db-service.yaml
  - lepinoid/deployment.yaml
  - lepinoid/service.yaml
  - lepinoid/network-policy.yaml
  - lepinoid/world-sync-config.yaml
  - lepinoid/world-versions.yaml
  - lepinoid/runtime-version.yaml
  - lepinoid/velocity.yaml
  - lepinoid/nats.yaml
  - lepinoid/rbac.yaml
  - build-server/mysql-credentials.sops.yaml
  - build-server/git-credentials.sops.yaml
  - build-server/lepinoid-tools-config.sops.yaml
  - build-server/pvc.yaml
  - build-server/mysql-pvc.yaml
  - build-server/deployment.yaml
  - build-server/service.yaml
  - build-server/mysql-deployment.yaml
  - build-server/mysql-service.yaml
  - build-server/network-policy.yaml
  - build-server/plugin-versions.yaml
  - build-server/plugin-updater-sa.yaml
  - build-server/plugin-updater-rbac.yaml
  - build-server/plugin-updater-lease.yaml
  - build-server/plugin-updater-cronjob.yaml

configMapGenerator:
  - name: world-sync-script
    files:
      - lepinoid/world-sync-init.sh
  - name: lepinoid-pool-runtime-scripts
    files:
      - lepinoid/runtime-entrypoint.sh
      - lepinoid/select-credentials.sh
  - name: lepinoid-pool-velocity
    files:
      - lepinoid/velocity.toml
  - name: lepinoid-pool-nats
    files:
      - lepinoid/nats.conf
