apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lepinoid-arc-controller
spec:
  interval: 30m
  timeout: 10m
  serviceAccountName: lepinoid-helm
  chartRef:
    kind: OCIRepository
    name: lepinoid-arc-controller-chart
  install:
    crds: Skip
    remediation:
      retries: 2
  upgrade:
    crds: Skip
    remediation:
      retries: 2
  values:
    fullnameOverride: lepinoid-arc-controller
    serviceAccount:
      create: true
      name: lepinoid-arc-controller
    flags:
      watchSingleNamespace: lepinoid
      logLevel: info
      logFormat: json
    podLabels:
      ci.turtton.net/control: "true"
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
