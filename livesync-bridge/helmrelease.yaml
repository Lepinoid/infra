apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: livesync-bridge
spec:
  type: oci
  url: oci://ghcr.io/turtton
  interval: 30m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: livesync-bridge
spec:
  interval: 30m
  chart:
    spec:
      chart: livesync-bridge
      version: ">=1.0.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: livesync-bridge
  values:
    vaultName: lepinoid
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    persistence:
      vault:
        size: 500Mi
        storageClassName: longhorn
      data:
        size: 500Mi
        storageClassName: longhorn
    networkPolicy:
      enabled: true
