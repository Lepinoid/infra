name: World bundle

on:
  schedule:
    - cron: "0 8 * * 5" # Friday 17:00 JST
  workflow_dispatch:
    inputs:
      ref:
        description: Lepinoid/Worlds ref to bundle
        required: false
        default: main
        type: string

concurrency:
  group: world-bundle
  cancel-in-progress: false

permissions: {}

jobs:
  world-bundle:
    name: Build and publish world bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      # AC8: Fetch latest infra main after acquiring the concurrency slot to serialize desired-state updates.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: false

      - name: Install verified ORAS
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz -o "$RUNNER_TEMP/oras.tar.gz"
          echo "f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454  $RUNNER_TEMP/oras.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C /usr/local/bin oras

      - name: Resolve enabled worlds
        id: worlds
        shell: bash
        run: |
          set -euo pipefail
          source ci/lib/world-bundle-version.sh
          source ci/lib/world-config.sh
          paths=$(world_config_enabled_names lepinoid/world-sync-config.yaml)
          {
            echo 'paths<<EOF'
            printf '%s\n' "$paths"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # PAT_TOKEN needs Lepinoid/Worlds contents:read (owner-managed, external prerequisite).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: Lepinoid/Worlds
          token: ${{ secrets.PAT_TOKEN }}
          ref: ${{ inputs.ref || 'main' }}
          path: worlds
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: ${{ steps.worlds.outputs.paths }}
          sparse-checkout-cone-mode: true

      - name: Build deterministic world bundle
        run: ci/build-world-bundle.sh worlds lepinoid/world-sync-config.yaml "$RUNNER_TEMP/bundle"

      - name: Publish world bundle (immutable tag)
        id: publish
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/publish-world-bundle.sh "$RUNNER_TEMP/bundle"

      - name: Update desired state and push
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          BUNDLE_DIR: ${{ runner.temp }}/bundle
        shell: bash
        run: |
          set -euo pipefail
          source ci/lib/world-bundle-version.sh
          source ci/lib/world-desired-state.sh
          version=$(jq -er .version "$BUNDLE_DIR/manifest.json")
          sha=$(jq -er .gitCommitSha "$BUNDLE_DIR/manifest.json")
          # Update both the ConfigMap and deployment annotation in ONE commit so Flux rolls the pod.
          world_desired_update "$DIGEST" "$version" "$sha" .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lepinoid/world-versions.yaml lepinoid/deployment.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(lepinoid): update world bundle to $version"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)" push "https://github.com/$REPOSITORY.git" HEAD:main
