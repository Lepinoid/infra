name: Shell script tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/**'
      - 'lepinoid/*.sh'
      - '.github/workflows/shell-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ci/**'
      - 'lepinoid/*.sh'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install busybox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends busybox-static
      - name: Syntax check (bash -n)
        run: |
          bash -n ci/*.sh ci/lib/*.sh ci/lib/*_test.sh
          if ls lepinoid/*.sh >/dev/null 2>&1; then
            bash -n lepinoid/*.sh
            busybox sh -n lepinoid/*.sh
          fi
      - name: Run unit tests
        run: |
          set -euo pipefail
          for t in ci/lib/*_test.sh; do
            echo "=== $t ==="
            bash "$t"
          done
