name: OpenTofu Validate

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-check.yml"
      - ".github/workflows/terraform-apply.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TF_VAR_state_encryption_passphrase: validation-only
      TF_VAR_cloudflare_api_token: validation-only
    steps:
      - name: Checkout PR revision without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_wrapper: false

      - name: Check formatting
        working-directory: terraform
        run: tofu fmt -check -recursive

      - name: Initialize providers without state
        working-directory: terraform
        run: tofu init -backend=false -input=false -no-color

      - name: Validate configuration
        working-directory: terraform
        run: tofu validate -no-color
