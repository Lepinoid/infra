name: Update world desired bundle
on:
  workflow_dispatch:
    inputs:
      version:
        description: World bundle version YYYY.MM.DD-<sha5> (manual rollback)
        required: false
        type: string
      digest:
        description: "World bundle digest sha256:... (alternative to version)"
        required: false
        type: string
concurrency:
  group: world-bundle
  cancel-in-progress: false
permissions: {}
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      # Check out latest main after acquiring the concurrency slot (AC8),
      # serializing desired-state updates with world-bundle.yml.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          persist-credentials: false
      - name: Install verified ORAS
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz -o "$RUNNER_TEMP/oras.tar.gz"
          echo "f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454  $RUNNER_TEMP/oras.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C /usr/local/bin oras
      - name: Resolve and validate world bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIGEST: ${{ inputs.digest }}
          OUT: ${{ runner.temp }}/world-desired.json
        run: ci/resolve-world-bundle.sh
      - name: Commit desired state and push
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DESIRED: ${{ runner.temp }}/world-desired.json
        shell: bash
        run: |
          set -euo pipefail
          source ci/lib/world-bundle-version.sh
          source ci/lib/world-desired-state.sh
          digest=$(jq -er .digest "$DESIRED")
          version=$(jq -er .version "$DESIRED")
          sha=$(jq -er .gitCommitSha "$DESIRED")
          world_desired_update "$digest" "$version" "$sha" .
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add lepinoid/world-versions.yaml lepinoid/deployment.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(lepinoid): rollback world bundle to $version"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)" push "https://github.com/$REPOSITORY.git" HEAD:main
