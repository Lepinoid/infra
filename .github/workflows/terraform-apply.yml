name: OpenTofu Apply

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Review a plan first, then apply from main
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

concurrency:
  group: terraform-apply
  cancel-in-progress: false

permissions:
  contents: write # Only used to commit encrypted state after an apply.

jobs:
  run:
    if: github.ref == 'refs/heads/main' && github.actor == 'turtton' && github.triggering_actor == 'turtton'
    runs-on: ubuntu-latest
    env:
      TF_VAR_state_encryption_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout reviewed main without credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
        with:
          tofu_wrapper: false

      - name: OpenTofu Init
        working-directory: terraform
        run: tofu init -input=false -no-color

      - name: OpenTofu Plan
        id: plan
        working-directory: terraform
        shell: bash
        run: |
          set +e
          tofu plan -detailed-exitcode -input=false -no-color -out=/tmp/tofu-plan.bin > /tmp/tofu-plan.log 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then
            echo '::error::OpenTofu plan failed. Detailed output is withheld from public Actions logs.'
            exit "$result"
          fi
          tofu show -json /tmp/tofu-plan.bin | jq -c '
            [.resource_changes[]? | select(.change.actions != ["no-op"])] as $changes
            | {
                count: ($changes | length),
                action_counts: ($changes | map(.change.actions | join("/")) | group_by(.) | map({action: .[0], count: length}))
              }
          ' > /tmp/tofu-plan-summary.json
          change_count=$(jq -r '.count' /tmp/tofu-plan-summary.json)
          if { [ "$result" -eq 0 ] && [ "$change_count" -ne 0 ]; } ||
             { [ "$result" -eq 2 ] && [ "$change_count" -eq 0 ]; }; then
            echo '::error::OpenTofu exit code disagrees with the saved plan. Apply is blocked.'
            exit 1
          fi
          if [ "$change_count" -gt 0 ]; then
            echo 'changes=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changes=false' >> "$GITHUB_OUTPUT"
          fi
          jq -r '.action_counts[] | "\(.action): \(.count)"' /tmp/tofu-plan-summary.json
          rm -f /tmp/tofu-plan-summary.json
          echo 'OpenTofu plan completed. Resource details are withheld from public logs.'

      - name: Confirm main still matches the reviewed revision
        if: inputs.mode == 'apply'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo '::error::main changed during this run. Re-run against the latest revision.'
            exit 1
          fi

      - name: OpenTofu Apply
        id: apply
        if: inputs.mode == 'apply' && steps.plan.outputs.changes == 'true'
        working-directory: terraform
        run: |
          if ! tofu apply -input=false -no-color /tmp/tofu-plan.bin > /tmp/tofu-apply.log 2>&1; then
            echo '::error::OpenTofu apply failed. Detailed output is withheld from public Actions logs.'
            exit 1
          fi
          echo 'OpenTofu apply completed.'

      - name: Commit encrypted state
        if: always() && inputs.mode == 'apply' && (steps.apply.outcome == 'success' || steps.apply.outcome == 'failure')
        working-directory: terraform
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c state-update
          git add terraform.tfstate
          if git diff --cached --quiet; then
            echo 'No state changes to commit.'
          else
            git commit -m 'Update encrypted terraform state'
            auth="http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
            git -c "$auth" pull --rebase origin main
            git -c "$auth" push origin HEAD:main
          fi
