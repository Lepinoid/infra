name: Plugin updater tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'updater/**'
      - 'ci/check-plugin-updater.sh'
      - '.github/workflows/plugin-updater-tests.yml'
  push:
    branches: [main]
    paths:
      - 'updater/**'
      - 'ci/check-plugin-updater.sh'
      - '.github/workflows/plugin-updater-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Check updater
        run: ci/check-plugin-updater.sh
