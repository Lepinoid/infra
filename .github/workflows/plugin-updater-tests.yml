name: Plugin updater tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'updater/**'
      - '.github/workflows/plugin-updater-tests.yml'
  push:
    branches: [main]
    paths:
      - 'updater/**'
      - '.github/workflows/plugin-updater-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Check updater
        working-directory: updater
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go test -race -shuffle=on -count=1 ./...
          go vet ./...
