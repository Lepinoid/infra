name: Update lepinoid runtime images

on:
  repository_dispatch:
    types: [runtime-image-update]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Published runtime commit (full SHA, both runtime and Velocity images required)"
        required: true
        type: string

concurrency:
  group: lepinoid-desired-state
  cancel-in-progress: false

permissions: {}

jobs:
  update-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          persist-credentials: false

      - name: Verify published image pair
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.event.client_payload.source_sha }}
          RUNTIME_IMAGE: ${{ github.event.client_payload.runtime_image }}
          VELOCITY_IMAGE: ${{ github.event.client_payload.velocity_image }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag=${SOURCE_SHA:0:7}
          runtime="ghcr.io/lepinoid/lepinoid:$tag"
          velocity="ghcr.io/lepinoid/lepinoid:$tag-velocity"
          [[ -z "$RUNTIME_IMAGE" || "$RUNTIME_IMAGE" == "$runtime" ]]
          [[ -z "$VELOCITY_IMAGE" || "$VELOCITY_IMAGE" == "$velocity" ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker manifest inspect "$runtime" >/dev/null
          docker manifest inspect "$velocity" >/dev/null
          printf 'source_sha=%s\ntag=%s\n' "$SOURCE_SHA" "$tag" >> "$GITHUB_ENV"

      - name: Publish compatible worlds and commit the complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run world-bundle.yml --ref main -f runtime_sha="$source_sha"
