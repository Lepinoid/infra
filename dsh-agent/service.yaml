# StatefulSet の serviceName 用。公開しない headless Service（Tailscale・Ingress・LoadBalancer にしない）。
# dsh は 127.0.0.1 で待ち受けるため、この Service 経由では接続できない。使い方は kubectl port-forward（README の「dsh-agent」節）。
apiVersion: v1
kind: Service
metadata:
  name: dsh-agent
  labels:
    app.kubernetes.io/name: lepinoid-dev-agent
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: lepinoid-dev-agent
  ports:
    - {name: web, port: 3080, targetPort: 3080}
