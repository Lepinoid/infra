# DeepSeek Harness（dsh、web profile）の専用 Pod。dev の調整作業を LLM エージェントと共同で行うための PoC（Lepinoid/infra#79）。
# - 公開しない。dsh は 127.0.0.1:3080 で待ち受け、kubectl port-forward pod/dsh-agent-0 3080:3080 で使う（README の「dsh-agent」節）。
# - サンドボックスは Landlock（D0 の実測: restricted 相当の securityContext のままで fully enforced。bwrap は不要）。
# - イメージは Lepinoid/dsh-agent が作る（tag@digest で固定。ci/check-manifests.sh が検査する）。
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsh-agent
  labels:
    app.kubernetes.io/name: lepinoid-dev-agent
spec:
  serviceName: dsh-agent
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: lepinoid-dev-agent
  template:
    metadata:
      labels:
        # runtime の MCP（8083）の ingress が選ぶラベル（lepinoid/network-policy.yaml の lepinoid-pool-runtime-mcp-deny と
        # lepinoid-pool-runtime）。変えるときは両方と、dsh-agent/network-policy.yaml を合わせる。
        app.kubernetes.io/name: lepinoid-dev-agent
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # 再帰的な権限変更で $DSH_HOME/.credentials.yaml にグループ権限が付くと、dsh は owner のみ読める条件の検査で
        # 起動を拒否する。ルートの所有者が合っていれば再帰変更を行わない。
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: dsh-agent
          # TODO(world-bridge-v2): bridge v2 を含む image の tag@digest へ差し替える（この image の 1 行だけ。README の
          # 「World UI 全機能化（bridge v2）の配備」の手順 1）。Lepinoid/dsh-agent#16 のマージ・公開の後に、公開された
          # `<dsh の版>-<SHA7>` の tag と digest を入れる。下の値は bridge v2 を含まない現行の image。このコメントが残る間は配備しない（DC-15）。
          image: ghcr.io/lepinoid/dsh-agent:0.2.2-rc.1-c17ee6a@sha256:44babf57e290f422e435dc2c7befd6ede86fa46930bddaeac490ef60882e0048
          imagePullPolicy: IfNotPresent
          # ENTRYPOINT / CMD（serve）はイメージのまま。起動時にパッケージを取得しない。
          # 待ち受けは既定の 127.0.0.1:3080（DSH_HOST は設定しない）。ワイルドカードは dsh が拒否する。
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          env:
            - {name: DSH_HOME, value: /data/dsh}
            - {name: HOME, value: /data/home}
            # Neuralwatt（llm-pi-ai のルート neuralwatt の apiKeyEnv）。optional にしない（キーがなければ起動させない）。
            # 値の SOPS 暗号化はユーザー本人が行う（dsh-agent/secrets.sops.yaml）。UI からはキーを保存しない
            # （.credentials.yaml の保存値が環境変数より優先されるため）。環境変数は起動時のスナップショットなので、
            # 変更後は kubectl -n lepinoid rollout restart statefulset/dsh-agent が要る。
            - name: NEURALWATT_API_KEY
              valueFrom:
                secretKeyRef: {name: dsh-agent-secrets, key: NEURALWATT_API_KEY}
            # dev 限定の MCP（runtime の 8083）の Bearer token。Secret lepinoid-dev-mcp は段階 1（infra#78）が作る。
            # 未作成でも Pod が起動するよう optional にする。回転は Secret の更新と runtime・本 Pod の再起動。
            - name: LEPINOID_MCP_TOKEN
              valueFrom:
                secretKeyRef: {name: lepinoid-dev-mcp, key: token, optional: true}
            # dev 限定の書き込み MCP（runtime の 8083 の /mcp/draft。Lepinoid/infra#94）の Bearer token。LEPINOID_MCP_TOKEN とは別の値・別の Secret。
            # 読み取りの行（mcp-lepinoid）にも書き込みの行（mcp-lepinoid-draft）にも、互いの token は送られない（イメージのシードの設計）。
            # optional: 未設定なら書き込みの行は disabled になり通信しない（読み取りの行は動いたまま）。回転は Secret の更新と runtime・本 Pod の再起動。
            - name: LEPINOID_MCP_DRAFT_TOKEN
              valueFrom:
                secretKeyRef: {name: lepinoid-dev-mcp-draft, key: token, optional: true}
            # Discord の bot token（dsh-discord。Lepinoid/infra#92）。Secret dsh-agent-discord は discord.sops.yaml（値の SOPS 暗号化は
            # ユーザー本人。turtton/infra の hermes-lepi と同じアプリなら同じ値）。未作成でも Pod が起動するよう optional にする。
            # token がない、または dsh-discord の設定が enabled: false の間は、Discord へ接続しない。
            # 設定カードの Connect で token を入力しない（.credentials.yaml の保存値が環境変数より優先され、回転が効かなくなる）。
            # 環境変数は起動時のスナップショットなので、Secret を変えたら kubectl -n lepinoid rollout restart statefulset/dsh-agent が要る。
            - name: DSH_DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: dsh-agent-discord, key: DSH_DISCORD_BOT_TOKEN, optional: true}
            # --- World UI 全機能化（bridge v2。Lepinoid/lepinoid#873・Lepinoid/dsh-agent#16。README の「World UI 全機能化（bridge v2）の配備」）---
            # bridge の宛先（runtime の origin。path・query・認証情報なし）。pool-0 固定（MCP と同じ。スナップショットが届くのは
            # pool-0 だけ）。同じ namespace なので Service 名の短い形を使う。NetworkPolicy は変えない（8083 の egress は
            # dsh-agent/network-policy.yaml に既にあり、ingress は lepinoid/network-policy.yaml が dsh-agent だけに許す）。
            - {name: LEPINOID_AGENT_BRIDGE_URL, value: "http://lepinoid-runtime-pool-0.lepinoid-runtime-pool:8083"}
            # runtime の LEPINOID_AGENT_BRIDGE_TOKEN と同じ Secret（lepinoid/agent-bridge.sops.yaml）・同じ namespace・同じ値。
            # LEPINOID_MCP_TOKEN・LEPINOID_MCP_DRAFT_TOKEN とは別の値（runtime が同値を拒否する）。optional にしない:
            # runtime と同じく、Secret が欠けたまま上がる状態を作らない（bridge は token がないと通信しない）。
            # 回転は Secret の更新と runtime・本 Pod の再起動（runtime を先に）。
            - name: LEPINOID_AGENT_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef: {name: lepinoid-agent-bridge, key: token}
            # Discord の開放設定。dsh-agent の docker/discord-settings.template.yml が、下の 4 つの環境変数から dsh-discord の設定を組む
            # （テンプレートは PVC の cordis.patch.yml の既存の dsh-discord の行へ、ユーザー本人が手動でマージする）。
            # ID（Guild・チャンネルアクセス role・owner の Discord user ID）はこの repo に平文で置かない: Secret dsh-agent-discord
            # （dsh-agent/discord.sops.yaml）の追加キーとして、ユーザー本人が `sops` で足す。
            # optional: キーが未設定の間は環境変数が付かず、テンプレートは enabled=false（3 つがそろうまで接続しない）になる
            # （空文字・一部だけの設定でも同じ）。環境変数は起動時のスナップショットなので、変更後は rollout restart が要る。
            - name: DSH_DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef: {name: dsh-agent-discord, key: DSH_DISCORD_GUILD_ID, optional: true}
            # チャンネルアクセス role の ID（memberRoleIds に入る）。Discord 側の ACL（@everyone の閲覧拒否・この role にだけ閲覧と投稿を許可）の
            # 点検が先（README の「Discord ACL の事前点検」）。点検のあと、非 owner へまだ付与していない role の ID を先に設定し、owner の管理下で
            # 全機能を確認する。非 owner への role の付与が最終の開放操作（README の配備手順の 8）。未設定の間は Discord は無効。
            - name: DSH_DISCORD_ACCESS_ROLE_ID
              valueFrom:
                secretKeyRef: {name: dsh-agent-discord, key: DSH_DISCORD_ACCESS_ROLE_ID, optional: true}
            # owner の Discord user ID（administratorUserIds に入る。下が owner のときは hostOperatorUserIds にも）。
            - name: DSH_DISCORD_OWNER_ID
              valueFrom:
                secretKeyRef: {name: dsh-agent-discord, key: DSH_DISCORD_OWNER_ID, optional: true}
            # hostOperatorUserIds の方針（秘密ではないのでここに置く）。"owner": owner だけを host operator にする（dsh-agent#16 の現行の方針。
            # 計画の §7.2・DC-13）。旧 Web 特例は戻らない: bridge は全セッションを Auto＋never に固定し、非 Auto の設定変更は owner にも拒否する。
            # 空にすると host operator なし（Web からの管理）。変更はこの行の PR と rollout restart。
            - {name: DSH_DISCORD_HOST_OPERATOR, value: owner}
          # loopback の 3080 への接続を試す（kubelet の httpGet は Pod IP へ向かうので使えない）。
          startupProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const s = require("net").connect({ host: "127.0.0.1", port: 3080 });
                  s.on("connect", () => process.exit(0));
                  s.on("error", () => process.exit(1));
                  setTimeout(() => process.exit(1), 3000);
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const s = require("net").connect({ host: "127.0.0.1", port: 3080 });
                  s.on("connect", () => process.exit(0));
                  s.on("error", () => process.exit(1));
                  setTimeout(() => process.exit(1), 3000);
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - |
                  const s = require("net").connect({ host: "127.0.0.1", port: 3080 });
                  s.on("connect", () => process.exit(0));
                  s.on("error", () => process.exit(1));
                  setTimeout(() => process.exit(1), 3000);
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # DSH_HOME（/data/dsh）、HOME（/data/home）、サンドボックスの作業ルート（/data/work）はすべて PVC 上。
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 20Gi
