apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lepinoid-pool-dns}
spec:
  podSelector:
    matchLabels: {lepinoid.net/pool: dev}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lepinoid-pool-runtime}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: lepinoid-runtime-pool}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: lepinoid-pool-velocity}
      ports:
        - {protocol: TCP, port: 25565}
        - {protocol: TCP, port: 8081}
    # dev 限定の MCP（8083）はエージェント Pod だけ。ラベルは仮値（段階 2 の D2 で変わったらここと
    # lepinoid-pool-runtime-mcp-deny を合わせる）。
    # ただし標準の NetworkPolicy の許可は加算されるので、この規則だけでは絞れない（クラスタ側の base の
    # allow-same-namespace が同じ namespace の全 Pod から、allow-monitoring-ingress が monitoring から全ポートを許可する）。
    # 8083 を実際に絞るのは、下の CiliumNetworkPolicy lepinoid-pool-runtime-mcp-deny の ingressDeny。
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: lepinoid-dev-agent}
      ports:
        - {protocol: TCP, port: 8083}
  egress:
    - to:
        - podSelector:
            matchLabels: {app: lepinoid-runtime-db}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: lepinoid-pool-nats}
      ports: [{protocol: TCP, port: 4222}]
    - ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lepinoid-pool-velocity}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: lepinoid-pool-velocity}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: tailscale}
      ports: [{protocol: TCP, port: 25565}]
  egress:
    - ports: [{protocol: TCP, port: 443}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: lepinoid-runtime-pool}
      ports:
        - {protocol: TCP, port: 25565}
        - {protocol: TCP, port: 8081}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lepinoid-pool-postgres}
spec:
  podSelector:
    matchLabels: {app: lepinoid-runtime-db}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: lepinoid-runtime-pool}
      ports: [{protocol: TCP, port: 5432}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lepinoid-pool-nats}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: lepinoid-pool-nats}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: lepinoid-runtime-pool}
      ports: [{protocol: TCP, port: 4222}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: lepinoid-resourcepack-ingress}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: lepinoid-runtime-pool}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: cloudflared}
      ports: [{protocol: TCP, port: 8082}]
---
# runtime の TCP 8083（dev 限定の MCP）を、エージェント Pod（lepinoid namespace かつ
# app.kubernetes.io/name=lepinoid-dev-agent）以外から拒否する。
# deny は標準 NetworkPolicy を含む allow より優先される（Cilium の Deny Policies）。deny の対象から例外を
# 除く構文はないので、「許可する Pod 以外」を NotIn で選ぶ（NotIn はキーのない Pod にも一致する）。
# 8083 以外のポートと、ほかの Pod の通信には影響しない（kubelet の probe は 8080）。
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lepinoid-pool-runtime-mcp-deny
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: lepinoid-runtime-pool}
  ingressDeny:
    - fromEndpoints:
        # ほかの namespace の全 Pod（monitoring を含む。許可ラベルが付いていても拒否する）
        - matchExpressions:
            - {key: "k8s:io.kubernetes.pod.namespace", operator: Exists}
            - {key: "k8s:io.kubernetes.pod.namespace", operator: NotIn, values: [lepinoid]}
        # lepinoid namespace の、エージェント以外の全 Pod（Velocity・cloudflared・runtime の他の Pod など）
        - matchLabels: {"k8s:io.kubernetes.pod.namespace": lepinoid}
          matchExpressions:
            - {key: app.kubernetes.io/name, operator: NotIn, values: [lepinoid-dev-agent]}
      toPorts:
        - ports: [{port: "8083", protocol: TCP}]
    # host は同じノードのホストと、そのノード上の hostNetwork の Pod（monitoring の Alloy など）を含む。
    # Cilium は同じノードのホストからの ingress を既定で許可する（allow-localhost）が、deny はその許可にも優先する。
    # kubectl port-forward は、containerd が Pod の netns の中で localhost:8083 に接続する（Pod 内の loopback）ので、
    # Pod の ingress ポリシーの対象にならず、host を拒否しても使える。8083 に probe はない。
    - fromEntities: [world, remote-node, host]
      toPorts:
        - ports: [{port: "8083", protocol: TCP}]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: lepinoid-pool-apiserver
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lepinoid-pool-velocity
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
            - {port: "6443", protocol: TCP}
