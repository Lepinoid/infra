# Tailscale Operator (tailscale namespace) からの Ingress 許可
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tailscale-ingress
spec:
  podSelector:
    matchLabels:
      app: lepinoid
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 25565
---
# lepinoid アプリからの Egress 許可（Mojang API / 認証データ取得など外部 HTTPS 用）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lepinoid-egress
spec:
  podSelector:
    matchLabels:
      app: lepinoid
  policyTypes:
    - Egress
  egress:
    - {}
