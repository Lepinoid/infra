apiVersion: apps/v1
kind: Deployment
metadata:
  name: lepinoid-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lepinoid-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lepinoid-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_DB
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: lepinoid-db-data
              mountPath: /var/lib/postgresql/data
            - name: lepinoid-db-init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: lepinoid-db-data
          persistentVolumeClaim:
            claimName: lepinoid-db-data
        - name: lepinoid-db-init-sql
          configMap:
            name: lepinoid-db-init-sql
