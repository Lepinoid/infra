apiVersion: apps/v1
kind: Deployment
metadata:
  name: lepinoid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lepinoid
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: lepinoid
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command:
            - sh
            - -c
            - until pg_isready -h lepinoid-db -U "$POSTGRES_USER"; do echo waiting for db; sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
        - name: render-database-config
          image: alpine:3.20
          command:
            - sh
            - -c
            - apk add -q gettext && envsubst < /config-template/database.json > /config/database.json
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: lepinoid-database-config-template
              mountPath: /config-template
              readOnly: true
            - name: lepinoid-database-config
              mountPath: /config
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 10m
              memory: 32Mi
      containers:
        - name: lepinoid
          image: ghcr.io/Lepinoid/lepinoid:main
          imagePullPolicy: Always
          env:
            - name: EULA
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512M -Xmx2G"
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          volumeMounts:
            - name: lepinoid-data
              mountPath: /data
            - name: lepinoid-database-config
              mountPath: /data/config/lepinoid/database.json
              subPath: database.json
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2.5Gi
      volumes:
        - name: lepinoid-data
          persistentVolumeClaim:
            claimName: lepinoid-data
        - name: lepinoid-database-config-template
          configMap:
            name: lepinoid-database-config
        - name: lepinoid-database-config
          emptyDir: {}
