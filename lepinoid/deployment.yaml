apiVersion: apps/v1
kind: Deployment
metadata:
  name: lepinoid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lepinoid
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        # world-bundle.yml / update-world-versions.yml が desired digest で更新する。
        # この annotation 変更が Pod template を変えるため rollout が発生し world-sync initContainer が切替を行う。
        lepinoid.dev/world-bundle-digest: "sha256:7265287e83edde00d29df063c52f14c285248f7f2e43b8d15f9aacf17cee648e"
      labels:
        app: lepinoid
    spec:
      # strict-local 依存がないため固定 (nodeSelector) ではなく優先配置とする
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - mainworker-1
      imagePullSecrets:
        - name: ghcr-pull-secret
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command:
            - sh
            - -c
            - until pg_isready -h lepinoid-db -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do echo waiting for db; sleep 2; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
        - name: render-configs
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cat > /config/database.json << EOF
              {
                "isEnable": true,
                "url": "//lepinoid-db:5432",
                "name": "lepinoid",
                "user": "${DB_USER}",
                "pass": "${DB_PASSWORD}",
                "init": "",
                "configs": {},
                "amounts": {
                  "maxPoolSize": 10,
                  "maxLifeTime": 1800000,
                  "connectionTimeout": 30000,
                  "idleTimeout": 600000
                }
              }
              EOF
              cat > /config/auth.json << EOF
              {
                "disable": false,
                "repository": "Lepinoid/OperatorInfo",
                "filePath": "operators.yml",
                "githubToken": "${GITHUB_TOKEN}"
              }
              EOF
              # world-sync が配布するワールドを mod が読み込むための worlds 設定（terrestrial=1 台ロード）
              cat > /config/config.json << EOF
              {
                "worlds": {
                  "terrestrial": 1
                },
                "vanilla": {
                  "genOverworld": true,
                  "genDimensions": true,
                  "mobSpawn": true,
                  "naturalRegeneration": true
                }
              }
              EOF
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lepinoid-db-credentials
                  key: POSTGRES_PASSWORD
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lepinoid-auth
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: lepinoid-configs
              mountPath: /config
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 10m
              memory: 32Mi
        # world-sync: desired bundle digest の /data/<world> への反映 (issue #30)。/data は root 所有のため runAsUser:0。script は ConfigMap world-sync-script 由来。
        - name: world-sync
          image: ghcr.io/lepinoid/plugin-updater:26.09.09-e53d4@sha256:2be4cde3ec89d76b323aed4f4ab77fd664acad713ffb91a3923a2bd85942dc92
          imagePullPolicy: IfNotPresent
          command: ["/bin/busybox", "sh", "/scripts/world-sync-init.sh"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: WORLD_BUNDLE_DIGEST
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['lepinoid.dev/world-bundle-digest']
            - name: WORLD_BUNDLE_REPOSITORY
              value: ghcr.io/lepinoid/world-bundle
            - name: REGISTRY_CONFIG
              value: /var/run/ghcr/.dockerconfigjson
            - name: DATA_DIR
              value: /data
            - name: WORK_DIR
              value: /work
            - name: PULL_TIMEOUT_SECONDS
              value: "900"
          volumeMounts:
            - name: lepinoid-data
              mountPath: /data
            - name: world-sync-script
              mountPath: /scripts
              readOnly: true
            - name: ghcr-pull-secret
              mountPath: /var/run/ghcr
              readOnly: true
            - name: world-sync-work
              mountPath: /work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
      containers:
        - name: lepinoid
          image: ghcr.io/lepinoid/lepinoid:5b621b0
          imagePullPolicy: Always
          env:
            - name: EULA
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms512M -Xmx2G"
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          volumeMounts:
            - name: lepinoid-data
              mountPath: /data
            - name: lepinoid-configs
              mountPath: /data/config/lepinoid/database.json
              subPath: database.json
              readOnly: true
            - name: lepinoid-configs
              mountPath: /data/config/lepinoid/auth.json
              subPath: auth.json
              readOnly: true
            - name: lepinoid-configs
              mountPath: /data/config/lepinoid/config.json
              subPath: config.json
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: minecraft
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2.5Gi
      volumes:
        - name: lepinoid-data
          persistentVolumeClaim:
            claimName: lepinoid-data
        - name: lepinoid-configs
          emptyDir: {}
        - name: world-sync-script
          configMap:
            name: world-sync-script
        - name: ghcr-pull-secret
          secret:
            secretName: ghcr-pull-secret
        - name: world-sync-work
          emptyDir:
            sizeLimit: 1Gi
