apiVersion: v1
kind: Service
metadata:
  name: lepinoid-runtime-pool
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: lepinoid-runtime-pool
  ports:
    - {name: minecraft, port: 25565, targetPort: minecraft}
    - {name: management, port: 8080, targetPort: management}
    - {name: control, port: 8081, targetPort: control}
    - {name: mcp, port: 8083, targetPort: mcp}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lepinoid-runtime-pool
spec:
  serviceName: lepinoid-runtime-pool
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  # The proxy owns replicas; Kubernetes defaults a newly created StatefulSet to one.
  selector:
    matchLabels:
      app.kubernetes.io/name: lepinoid-runtime-pool
  template:
    metadata:
      annotations:
        lepinoid.dev/world-bundle-digest: "sha256:0d7910a9412e384444b622e0d72e0e6b111f1ccf7d77804f60ee1e6d1f67e12a"
      labels:
        app.kubernetes.io/name: lepinoid-runtime-pool
        lepinoid.net/pool: dev
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: world-sync
          image: ghcr.io/lepinoid/plugin-updater:26.09.23-a3964@sha256:82e9413fb43ba041673fcdd20de29fc765c1dd8327eefe45cbe4f4e0f0c09a5b
          imagePullPolicy: IfNotPresent
          command: [/bin/busybox, sh, -ec]
          args:
            - |
              /bin/busybox sh /scripts/world-sync-init.sh
              /bin/busybox chmod -R a+rX /worlds
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          env:
            - name: WORLD_BUNDLE_DIGEST
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['lepinoid.dev/world-bundle-digest']
            - {name: WORLD_BUNDLE_REPOSITORY, value: ghcr.io/lepinoid/runtime-world-bundle}
            - {name: REGISTRY_CONFIG, value: /var/run/ghcr/.dockerconfigjson}
            - {name: DATA_DIR, value: /worlds}
            - {name: WORK_DIR, value: /work}
            - {name: PULL_TIMEOUT_SECONDS, value: "900"}
          volumeMounts:
            - {name: worlds, mountPath: /worlds}
            - {name: world-sync-script, mountPath: /scripts, readOnly: true}
            - {name: ghcr-pull-secret, mountPath: /var/run/ghcr, readOnly: true}
            - {name: world-sync-work, mountPath: /work}
        - name: select-presence-credentials
          image: ghcr.io/lepinoid/lepinoid:fdc0e90
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /run/pool/select-credentials.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          env:
            - name: LEPINOID_INSTANCE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          volumeMounts:
            - {name: runtime-scripts, mountPath: /run/pool, readOnly: true}
            - {name: all-presence-credentials, mountPath: /run/all-presence, readOnly: true}
            - {name: selected-presence-credentials, mountPath: /run/presence}
      containers:
        - name: runtime
          image: ghcr.io/lepinoid/lepinoid:fdc0e90
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /run/pool/runtime-entrypoint.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - {name: minecraft, containerPort: 25565}
            - {name: management, containerPort: 8080}
            - {name: control, containerPort: 8081}
            - {name: resourcepack, containerPort: 8082}
            # dev 限定の MCP（Lepinoid/lepinoid#784）。probe は付けない（/readyz・/livez は management の 8080）。
            # 公開 Service には載せない。到達元は CiliumNetworkPolicy lepinoid-pool-runtime-mcp-deny（ingressDeny）で絞る。
            - {name: mcp, containerPort: 8083}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: 1500m, memory: 3Gi}
          env:
            - {name: JAVA_TOOL_OPTIONS, value: "-Xmx2g -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError"}
            - name: LEPINOID_INSTANCE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            # dev 配備なので開発専用の管理コマンド（debug・sign add|remove・/give・/summon など）を登録する。
            # 未設定では prod として起動する。値は prod / dev のみで、それ以外は起動エラーになる。
            - {name: LEPINOID_RUNTIME_PROFILE, value: dev}
            - {name: LEPINOID_BIND_HOST, value: "0.0.0.0"}
            - {name: LEPINOID_PORT, value: "25565"}
            - {name: LEPINOID_STATUS_BIND_HOST, value: "0.0.0.0"}
            - {name: LEPINOID_STATUS_PORT, value: "8080"}
            - {name: LEPINOID_TRANSFER_BIND_HOST, value: "0.0.0.0"}
            - {name: LEPINOID_TRANSFER_PORT, value: "8081"}
            - {name: LEPINOID_MCP_BIND_HOST, value: "0.0.0.0"}
            - {name: LEPINOID_MCP_PORT, value: "8083"}
            - {name: LEPINOID_MAX_PLAYERS, value: "8"}
            - {name: LEPINOID_VIEW_DISTANCE, value: "8"}
            - {name: LEPINOID_WORLD, value: TERRESTRIAL}
            - {name: LEPINOID_WORLD_PATH, value: /worlds/terrestrial}
            - {name: LEPINOID_SECOND_WORLD_PATH, value: /worlds/lv1}
            # Worlds の各 world 直下の areas.json（建築サーバーのエリア編集 GUI が保存）は bundle に同梱される。
            # ファイルがない world は runtime が ABSENT としてログに出し、エリア機能だけを無効にする。
            - {name: LEPINOID_TERRESTRIAL_AREAS_PATH, value: /worlds/terrestrial/areas.json}
            - {name: LEPINOID_LV1_AREAS_PATH, value: /worlds/lv1/areas.json}
            - {name: LEPINOID_WORLD_SCRATCH, value: /scratch}
            - {name: LEPINOID_AUTHENTICATION, value: velocity}
            - name: LEPINOID_VELOCITY_SECRET
              valueFrom: {secretKeyRef: {name: lepinoid-runtime-secrets, key: forwarding-secret}}
            - name: LEPINOID_TRANSFER_SECRET
              valueFrom: {secretKeyRef: {name: lepinoid-runtime-secrets, key: transfer-secret}}
            # MCP 専用の token。forwarding-secret・transfer-secret とは別の値にする（runtime が同値を拒否する）。
            - name: LEPINOID_MCP_TOKEN
              valueFrom: {secretKeyRef: {name: lepinoid-dev-mcp, key: token}}
            # エージェント bridge（/agent/*。MCP と同じ 8083 の別パス）専用の token（Lepinoid/lepinoid#840、Lepinoid/infra#93）。
            # LEPINOID_MCP_TOKEN・forwarding-secret・transfer-secret とは別の値にする（runtime が同値を拒否する）。
            # optional にしない: Secret が欠けたまま口だけ有効になる状態を作らない（LEPINOID_MCP_TOKEN と同じ）。
            - name: LEPINOID_AGENT_BRIDGE_TOKEN
              valueFrom: {secretKeyRef: {name: lepinoid-agent-bridge, key: token}}
            # /agent/* の World UI の操作を許すロール（カンマ区切り）。許可する人の正本は Lepinoid/OperatorInfo の operators.yml で、
            # runtime は既存の operator 認可（ロール）で判定する。許可リストの Secret・mount は持たない。
            - {name: LEPINOID_AGENT_ROLES, value: "owner,developer,builder"}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: lepinoid-db-credentials, key: POSTGRES_DB}}
            - {name: LEPINOID_JDBC_URL, value: "jdbc:postgresql://lepinoid-runtime-db:5432/$(POSTGRES_DB)"}
            - name: LEPINOID_DB_USER
              valueFrom: {secretKeyRef: {name: lepinoid-db-credentials, key: POSTGRES_USER}}
            - name: LEPINOID_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: lepinoid-db-credentials, key: POSTGRES_PASSWORD}}
            # 設定 revision ストア（設定 DB lepinoid_config）の接続設定。dev プロファイルかつ enabled=true の起動時に
            # スキーマ作成と spawn・weapon の初期 revision 作成が自動で行われる。LEPINOID_SERVER_CONFIG_PATH は未配備（自然湧きは無効のまま）。
            - {name: LEPINOID_SPAWN_CONFIG_PATH, value: /run/spawn-config/spawnconfig.json}
            - {name: LEPINOID_AUTH_REPOSITORY, value: Lepinoid/OperatorInfo}
            - {name: LEPINOID_AUTH_FILE_PATH, value: operators.yml}
            - name: LEPINOID_AUTH_GITHUB_TOKEN
              valueFrom: {secretKeyRef: {name: lepinoid-auth, key: GITHUB_TOKEN}}
            - {name: LEPINOID_OP_PERMISSION_LEVEL, value: "4"}
            - name: LEPINOID_CRAFT_KEY_ID
              valueFrom: {secretKeyRef: {name: lepinoid-runtime-secrets, key: craft-key-id}}
            - {name: LEPINOID_CRAFT_SEED_FILE, value: /run/crafting/seed.bin}
            - {name: LEPINOID_PRESENCE_ENABLED, value: "true"}
            - {name: LEPINOID_PRESENCE_ENDPOINT, value: "nats://lepinoid-pool-nats:4222"}
            - {name: LEPINOID_PRESENCE_ENVIRONMENT, value: runtime-pool}
            - {name: LEPINOID_WORLD_EDITS_PATH, value: /data/world-edits}
            - {name: LEPINOID_RESOURCE_PACK_HTTP_HOST, value: "0.0.0.0"}
            - {name: LEPINOID_RESOURCE_PACK_HTTP_PORT, value: "8082"}
            - {name: LEPINOID_RESOURCE_PACK_URL, value: "https://pack-dev.lepinoid.net/resourcepack.zip?runtime=fdc0e90"}
          startupProbe:
            httpGet: {path: /readyz, port: management}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: management}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: management}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - {name: world-edits, mountPath: /data}
            - {name: worlds, mountPath: /worlds, readOnly: true}
            - {name: scratch, mountPath: /scratch}
            - {name: tmp, mountPath: /tmp}
            - {name: runtime-scripts, mountPath: /run/pool, readOnly: true}
            - {name: selected-presence-credentials, mountPath: /run/presence, readOnly: true}
            - {name: crafting-key, mountPath: /run/crafting, readOnly: true}
            - {name: spawn-config, mountPath: /run/spawn-config, readOnly: true}
      volumes:
        - {name: worlds, emptyDir: {}}
        - {name: scratch, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: runtime-scripts
          configMap: {name: lepinoid-pool-runtime-scripts}
        - name: selected-presence-credentials
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        - name: world-sync-script
          configMap: {name: world-sync-script}
        - name: ghcr-pull-secret
          secret: {secretName: ghcr-pull-secret}
        - name: world-sync-work
          emptyDir: {}
        - name: all-presence-credentials
          secret:
            secretName: lepinoid-runtime-secrets
            defaultMode: 0440
            items:
              - {key: presence-0.username, path: presence-0.username}
              - {key: presence-0.password, path: presence-0.password}
              - {key: presence-1.username, path: presence-1.username}
              - {key: presence-1.password, path: presence-1.password}
              - {key: presence-2.username, path: presence-2.username}
              - {key: presence-2.password, path: presence-2.password}
        - name: crafting-key
          secret:
            secretName: lepinoid-runtime-secrets
            defaultMode: 0440
            items: [{key: craft-seed, path: seed.bin}]
        - name: spawn-config
          secret:
            secretName: lepinoid-spawn-config
            defaultMode: 0440
            items: [{key: spawnconfig.json, path: spawnconfig.json}]
  volumeClaimTemplates:
    - metadata:
        name: world-edits
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources:
          requests:
            storage: 1Gi
