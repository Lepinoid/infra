apiVersion: v1
kind: ServiceAccount
metadata: {name: lepinoid-pool-velocity}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: lepinoid-pool-velocity}
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [lepinoid-runtime-pool]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    resourceNames: [lepinoid-runtime-pool-0, lepinoid-runtime-pool-1, lepinoid-runtime-pool-2]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: lepinoid-pool-velocity}
subjects:
  - kind: ServiceAccount
    name: lepinoid-pool-velocity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lepinoid-pool-velocity
