apiVersion: v1
kind: Service
metadata: {name: lepinoid-pool-velocity}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: lepinoid-pool-velocity}
  ports: [{name: minecraft, port: 25565, targetPort: minecraft}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: lepinoid-pool-velocity}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: lepinoid-pool-velocity}
  template:
    metadata:
      annotations:
        lepinoid.dev/world-bundle-digest: "sha256:c1802eef410656898f51741fb24c250ffa5b7c7f51447308f62196ca5e1b9f3c"
      labels:
        app.kubernetes.io/name: lepinoid-pool-velocity
        lepinoid.net/pool: dev
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: lepinoid-pool-velocity
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: velocity
          image: ghcr.io/lepinoid/lepinoid:1dfadd4-velocity
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: minecraft, containerPort: 25565}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          env:
            - {name: JAVA_TOOL_OPTIONS, value: "-Xmx256m -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError"}
            - {name: LEPINOID_POOL_MIN_INSTANCES, value: "1"}
            - {name: LEPINOID_POOL_MAX_INSTANCES, value: "3"}
            - {name: LEPINOID_POOL_CAPACITY, value: "8"}
            - {name: LEPINOID_K8S_STATEFULSET, value: lepinoid-runtime-pool}
            - name: LEPINOID_K8S_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: LEPINOID_POOL_FINGERPRINT
              valueFrom: {configMapKeyRef: {name: lepinoid-runtime-worlds, key: pool-fingerprint}}
            - name: LEPINOID_TRANSFER_SECRET
              valueFrom: {secretKeyRef: {name: lepinoid-runtime-secrets, key: transfer-secret}}
          startupProbe:
            tcpSocket: {port: minecraft}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: minecraft}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket: {port: minecraft}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - {name: work, mountPath: /work}
            - {name: tmp, mountPath: /tmp}
            - {name: configuration, mountPath: /run/velocity, readOnly: true}
            - {name: forwarding-secret, mountPath: /run/forwarding, readOnly: true}
      volumes:
        - {name: work, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: configuration
          configMap: {name: lepinoid-pool-velocity}
        - name: forwarding-secret
          secret:
            secretName: lepinoid-runtime-secrets
            defaultMode: 0440
            items: [{key: forwarding-secret, path: secret}]
