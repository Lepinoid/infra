apiVersion: v1
kind: Service
metadata:
  name: lepinoid
  annotations:
    tailscale.com/hostname: lepinoid-dev
    tailscale.com/tags: "tag:mcserver"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app: lepinoid
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
